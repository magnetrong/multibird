name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Deliberately no netbird install: `go test ./...` must pass without it.
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8

  version-coupling:
    name: pinned module matches TESTED_VERSIONS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-version-coupling.sh

  integration:
    name: integration smoke (pinned netbird)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install pinned netbird binary
        run: |
          VER=$(./scripts/pinned-netbird-version.sh)
          curl -sSL "https://github.com/netbirdio/netbird/releases/download/v${VER}/netbird_${VER}_linux_amd64.tar.gz" | sudo tar -xzf - -C /usr/local/bin netbird
          netbird version
      - run: sudo --preserve-env=PATH env "PATH=$PATH" go test -tags integration -run TestIntegration ./...
