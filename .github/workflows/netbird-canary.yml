name: netbird-canary

# Weekly drift detector: run the integration smoke test against the LATEST
# upstream netbird release. On failure, open/update a tracking issue so we
# learn about CLI/proto drift before users do.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install latest netbird release
        id: nb
        run: |
          VER=$(curl -sSL https://api.github.com/repos/netbirdio/netbird/releases/latest | jq -r .tag_name | sed 's/^v//')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          curl -sSL "https://github.com/netbirdio/netbird/releases/download/v${VER}/netbird_${VER}_linux_amd64.tar.gz" | sudo tar -xzf - -C /usr/local/bin netbird
          netbird version
      - name: Smoke test against latest
        id: smoke
        run: sudo --preserve-env=PATH env "PATH=$PATH" go test -tags integration -run TestIntegration ./...
      - name: File / update drift issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const ver = '${{ steps.nb.outputs.version }}';
            const title = 'canary: smoke test fails against netbird ' + ver;
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'netbird-drift' });
            const body = `The weekly canary failed against netbird v${ver}.\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              'Likely CLI or proto drift — see CLAUDE.md "Version policy" for the bump procedure.';
            const existing = issues.find(i => i.title.startsWith('canary:'));
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              if (existing.title !== title) {
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, title });
              }
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['netbird-drift'] });
            }
